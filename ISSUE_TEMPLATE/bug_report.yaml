name: Bug
description: Report incorrect behavior
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is happening?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: App version or commit concerned
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, browser, device, etc.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Never paste tokens, passwords or personal data.
